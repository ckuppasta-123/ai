
services:
  backend:
    build: ./backend
    container_name: ai-visionops-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-visionops-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
