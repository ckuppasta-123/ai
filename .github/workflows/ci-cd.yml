name: AI VisionOps CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: ai-visionops-cluster

jobs:
  backend-tests:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" python-multipart pillow numpy httpx pytest

      - name: Run API test suite
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v --tb=short

  frontend-validation:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint check
        working-directory: frontend
        run: npm run lint

      - name: Validate production bundle build
        working-directory: frontend
        run: npm run build

  k8s-validation:
    name: Kubernetes Manifest Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Kubernetes YAML manifests
        run: |
          python -m pip install pyyaml
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f, encoding='utf-8'))) for f in glob.glob('k8s/*.yaml')]; print('Kubernetes YAML syntax OK')"

  docker-build:
    name: Build & Verify Docker Images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-validation, k8s-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend container image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: ai-visionops-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend container image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: ai-visionops-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker images
        run: |
          docker image inspect ai-visionops-backend:${{ github.sha }}
          docker image inspect ai-visionops-frontend:${{ github.sha }}

  deploy-aws:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: docker-build
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check AWS credentials availability
        id: check_aws
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_KEY" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "AWS credentials detected in GitHub Secrets."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "No AWS credentials detected. Skipping cloud rollout step."
          fi

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create ECR repositories
        if: steps.check_aws.outputs.has_creds == 'true'
        run: |
          aws ecr describe-repositories \
            --repository-names ai-visionops-backend \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name ai-visionops-backend \
            --region "$AWS_REGION"

          aws ecr describe-repositories \
            --repository-names ai-visionops-frontend \
            --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name ai-visionops-frontend \
            --region "$AWS_REGION"

      - name: Push Images to Amazon ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag ai-visionops-backend:${{ github.sha }} \
            $REGISTRY/ai-visionops-backend:${{ github.sha }}

          docker tag ai-visionops-backend:${{ github.sha }} \
            $REGISTRY/ai-visionops-backend:latest

          docker push $REGISTRY/ai-visionops-backend:${{ github.sha }}
          docker push $REGISTRY/ai-visionops-backend:latest

          docker tag ai-visionops-frontend:${{ github.sha }} \
            $REGISTRY/ai-visionops-frontend:${{ github.sha }}

          docker tag ai-visionops-frontend:${{ github.sha }} \
            $REGISTRY/ai-visionops-frontend:latest

          docker push $REGISTRY/ai-visionops-frontend:${{ github.sha }}
          docker push $REGISTRY/ai-visionops-frontend:latest

      - name: Connect to AWS EKS and Rollout
        if: steps.check_aws.outputs.has_creds == 'true'
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          CLUSTER: ${{ secrets.EKS_CLUSTER_NAME || env.EKS_CLUSTER_NAME }}
          REGION: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER" \
            --region "$REGION"

          sed -i "s|image: ai-backend:latest|image: $REGISTRY/ai-visionops-backend:${{ github.sha }}|g" \
            k8s/backend-deployment.yaml

          sed -i "s|image: ai-frontend:latest|image: $REGISTRY/ai-visionops-frontend:${{ github.sha }}|g" \
            k8s/frontend-deployment.yaml

          kubectl apply -f k8s/

          kubectl rollout status deployment/ai-backend \
            -n ai-visionops \
            --timeout=180s

          kubectl rollout status deployment/ai-frontend \
            -n ai-visionops \
            --timeout=120s

